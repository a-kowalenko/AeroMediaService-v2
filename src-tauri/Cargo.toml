[package]
name = "aero-media-service"
version = "0.1.3"
description = "Aero Media Service — folder monitor, cloud upload, customer notifications"
authors = ["AKSoftware"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This is only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aero_media_service_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
# v3 has no default stores — platform backends must be enabled explicitly.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
once_cell = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
tokio = { version = "1", features = ["macros", "time", "sync", "rt-multi-thread", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "multipart"] }
async-trait = "0.1"
sha2 = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
imap = "2.4"
native-tls = "0.2"
base64 = "0.22"
tauri-plugin-dialog = "2"
axum = { version = "0.8", default-features = false, features = ["macros", "json", "tokio", "http1"] }
mdns-sd = "0.15"
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[dev-dependencies]
tempfile = "3"
