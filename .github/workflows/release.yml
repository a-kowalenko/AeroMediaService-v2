# Release — build updater artifacts and publish to the public releases repo.
#
# Trigger: push a version tag (v0.1.0, v0.1.0-beta.1, …).
# Target:  https://github.com/a-kowalenko/aero-media-service-releases
#
# Required secrets (private repo):
#   RELEASES_GITHUB_TOKEN              — PAT with Contents R/W on the releases repo
#   TAURI_SIGNING_PRIVATE_KEY          — updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — key password (optional if key has none)
#
# Stable tags: after merge-updater-manifest, promote-latest sets GitHub Latest.
# Prerelease tags (vX.Y.Z-beta.N / -rc.N): marked prerelease, never Latest.
#
# The public releases repo must have at least one commit on its default branch
# (e.g. README). Tags for releases are created there pointing at that branch tip.
#
# Optional later: APPLE_* / Windows Authenticode (not required for unsigned shipping).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or new tag to release (e.g. v0.1.1 or v0.1.1-beta.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASES_OWNER: a-kowalenko
  RELEASES_REPO: aero-media-service-releases

jobs:
  # Create tag + GitHub Release on the public repo once (avoids Win/Mac/Linux race +
  # invalid target_commitish when the tag only exists in the private repo).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      release_id: ${{ steps.ensure.outputs.release_id }}
      release_notes: ${{ steps.ensure.outputs.release_notes }}
    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid tag '$TAG' (expected vX.Y.Z or vX.Y.Z-beta.N)" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          IS_PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG (prerelease=$IS_PRERELEASE)"

      - name: Checkout source (for CHANGELOG.md)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 1

      - name: Ensure tag and release on public repo
        id: ensure
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
          SOURCE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing secret RELEASES_GITHUB_TOKEN" >&2
            exit 1
          fi

          REPO="${RELEASES_OWNER}/${RELEASES_REPO}"

          # User-facing notes from CHANGELOG.md (not auto-generated commit spam).
          # If the tag predates CHANGELOG (e.g. re-run for an older tag), load
          # the section from the source repo default branch.
          if [ ! -f CHANGELOG.md ] || ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            SRC_BRANCH=$(GH_TOKEN="${GITHUB_TOKEN}" gh api "repos/${SOURCE_REPO}" --jq .default_branch)
            echo "CHANGELOG section ## [${VERSION}] missing on tag; fetching from ${SOURCE_REPO}@${SRC_BRANCH}"
            GH_TOKEN="${GITHUB_TOKEN}" gh api \
              "repos/${SOURCE_REPO}/contents/CHANGELOG.md?ref=${SRC_BRANCH}" \
              --jq .content | tr -d '\n' | base64 --decode > CHANGELOG.md
          fi
          NOTES="$(node scripts/changelog.mjs extract "${VERSION}")"
          if [ -z "${NOTES}" ]; then
            NOTES="Aero Media Service ${VERSION}"
          fi
          DELIM="NOTES_EOF_$(openssl rand -hex 8)"
          {
            echo "release_notes<<${DELIM}"
            printf '%s\n' "${NOTES}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

          DEFAULT_BRANCH=$(gh api "repos/${REPO}" --jq .default_branch)
          echo "Releases repo default branch: ${DEFAULT_BRANCH}"

          if ! SHA=$(gh api "repos/${REPO}/git/ref/heads/${DEFAULT_BRANCH}" --jq .object.sha); then
            echo "ERROR: Branch '${DEFAULT_BRANCH}' missing or repo has no commits." >&2
            echo "Open ${REPO}, add a README commit on the default branch, then re-run." >&2
            exit 1
          fi
          echo "Default branch SHA: ${SHA}"

          # Create lightweight tag on the public repo if it does not exist yet.
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on ${REPO}"
          else
            echo "Creating tag ${TAG} on ${REPO} → ${SHA}"
            gh api "repos/${REPO}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${SHA}"
          fi

          NOTES_FILE="$(mktemp)"
          printf '%s\n' "${NOTES}" > "${NOTES_FILE}"
          TITLE="Aero Media Service ${VERSION}"

          # Create published release if missing; otherwise refresh body from CHANGELOG.
          # Always create with --latest=false; stable is promoted after assets upload.
          if RELEASE_ID=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq .id 2>/dev/null); then
            echo "Release for ${TAG} already exists (id=${RELEASE_ID}) — updating notes"
            if [ "${IS_PRERELEASE}" = "true" ]; then
              gh release edit "${TAG}" \
                --repo "${REPO}" \
                --notes-file "${NOTES_FILE}" \
                --title "${TITLE}" \
                --prerelease
            else
              gh release edit "${TAG}" \
                --repo "${REPO}" \
                --notes-file "${NOTES_FILE}" \
                --title "${TITLE}" \
                --prerelease=false
            fi
          else
            echo "Creating release ${TAG} (prerelease=${IS_PRERELEASE})"
            PRE_ARGS=()
            if [ "${IS_PRERELEASE}" = "true" ]; then
              PRE_ARGS+=(--prerelease)
            fi
            gh release create "${TAG}" \
              --repo "${REPO}" \
              --title "${TITLE}" \
              --notes-file "${NOTES_FILE}" \
              --latest=false \
              "${PRE_ARGS[@]}"
            RELEASE_ID=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq .id)
          fi
          rm -f "${NOTES_FILE}"

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Apple Silicon (M1+) — native on macos-latest (arm64)
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # Intel Mac — cross-compile from arm64 runner
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          # Linux x86_64 AppImage (WebKitGTK / patchelf via apt)
          - platform: ubuntu-22.04
            args: "--bundles appimage"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require updater signing secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "Missing secret TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          fi
          if [ -z "${{ secrets.RELEASES_GITHUB_TOKEN }}" ]; then
            echo "Missing secret RELEASES_GITHUB_TOKEN" >&2
            exit 1
          fi

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both macOS targets so Intel can be cross-built on arm64 runners.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.args || 'host' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to existing release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: ${{ env.RELEASES_OWNER }}
          repo: ${{ env.RELEASES_REPO }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseName: Aero Media Service ${{ needs.prepare.outputs.version }}
          releaseBody: ${{ needs.prepare.outputs.release_notes }}
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          # latest.json is merged in merge-updater-manifest (parallel jobs overwrite each other).
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  # Merge signed updater manifest from all release assets (fixes macOS keys lost when
  # the last matrix job overwrote latest.json with Windows/Linux-only entries).
  merge-updater-manifest:
    needs: [prepare, release]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Merge and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing secret RELEASES_GITHUB_TOKEN" >&2
            exit 1
          fi
          NOTES_FILE="$(mktemp)"
          node scripts/changelog.mjs extract "${TAG#v}" > "${NOTES_FILE}" || true
          node scripts/merge-updater-manifest.mjs \
            --tag "${TAG}" \
            --out latest.json \
            --notes-file "${NOTES_FILE}" \
            --upload
          rm -f "${NOTES_FILE}"

  # After merged latest.json is on the release, mark stable releases as Latest
  # so /releases/latest/download/latest.json points at a complete build.
  promote-latest:
    needs: [prepare, merge-updater-manifest]
    if: needs.prepare.outputs.is_prerelease == 'false' && needs.merge-updater-manifest.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (semver helper)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 1

      - name: Promote stable release to Latest
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${RELEASES_OWNER}/${RELEASES_REPO}"

          # Require updater manifest so clients do not hit an empty Latest.
          if ! gh release view "${TAG}" --repo "${REPO}" --json assets \
            --jq '.assets[].name' | grep -qx 'latest.json'; then
            echo "ERROR: latest.json missing on ${TAG} — refusing to set Latest." >&2
            exit 1
          fi

          # Do not demote a newer Latest when re-running an older stable tag.
          CURRENT_LATEST="$(gh api "repos/${REPO}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -n "${CURRENT_LATEST}" ]; then
            CURRENT_VER="${CURRENT_LATEST#v}"
            CMP="$(node --input-type=module -e "
              import { compareSemVer } from './scripts/semver.mjs';
              const c = compareSemVer(process.argv[1], process.argv[2]);
              process.stdout.write(c < 0 ? 'older' : c > 0 ? 'newer' : 'same');
            " "${VERSION}" "${CURRENT_VER}")"
            if [ "${CMP}" = "older" ]; then
              echo "Skip Latest: ${TAG} is older than current Latest ${CURRENT_LATEST}"
              exit 0
            fi
          fi

          echo "Setting ${TAG} as Latest on ${REPO}"
          gh release edit "${TAG}" --repo "${REPO}" --latest=true
